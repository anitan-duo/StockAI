[project]
name = "stockai-backend"
version = "0.1.0"
description = "StockAI Backend - AI-powered stock market analysis platform"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "sqlalchemy>=2.0.0",
    "greenlet>=3.0.0",
    "alembic>=1.13.0",
    "asyncpg>=0.29.0",
    "redis>=5.0.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "bcrypt==4.0.1",
    "python-multipart>=0.0.6",
    "httpx>=0.26.0",
    "tenacity>=8.2.0",
    "pandas>=2.1.0",
    "numpy>=1.26.0",
    "ta-lib>=0.4.28",
    "python-dateutil>=2.8.2",
    "pyyaml>=6.0.1",
    "structlog>=24.1.0",
    "email-validator>=2.1.0",
    "scikit-learn>=1.3.0",
    "shap>=0.44.0",
    "joblib>=1.3.0",
    "yfinance>=0.2.30",
    "beautifulsoup4>=4.12.0",
    "lxml>=4.9.0",
    "aiosqlite>=0.22.1",
]

[project.optional-dependencies]
research = [
    "duckdb>=1.1",
]
finbert = [
    "duckdb>=1.1",
    "torch>=2.6",
    "transformers>=4.40",
]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.12.0",
    "httpx>=0.26.0",
    "factory-boy>=3.3.0",
    "faker>=22.0.0",
    "ruff>=0.1.0",
    "mypy>=1.8.0",
    "pre-commit>=3.6.0",
]

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["apps*", "services*", "packages*"]
exclude = ["tests*", "database*", "infrastructure*", "docs*"]

[tool.ruff]
line-length = 100
target-version = "py311"
select = [
    "E", "F", "I", "N", "W", "UP", "B", "C4", "SIM", "T20", "ARG", "PTH", "ERA", "PL", "TRY", "PD", "PGH", "RSE", "RET", "ASYNC"
]
ignore = ["S101", "TRY003"]
per-file-ignores = { "tests/**/*.py" = ["S101", "ARG001", "ARG002"] }

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
strict_optional = true
show_error_codes = true
namespace_packages = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "--tb=line -q"
markers = [
    "integration: requires live PostgreSQL (run in the postgres suite; excluded from sqlite)",
    "sqlite: runs in the SQLite unit/ML suite",
]
filterwarnings = [
    "ignore::DeprecationWarning:joblib",
    "ignore:Setting the shape on a NumPy array has been deprecated:DeprecationWarning",
    "ignore:unclosed transport:ResourceWarning",
    "ignore:Using `httpx` with `starlette.testclient` is deprecated:Warning",
    "ignore:The garbage collector is trying to clean up non-checked-in connection:Warning",
]

[tool.coverage.run]
source = ["apps", "services", "packages"]
omit = ["*/tests/*", "*/migrations/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]

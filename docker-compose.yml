services:
  postgres:
    image: postgres:16-alpine
    container_name: stockai-postgres
    environment:
      POSTGRES_USER: stockai
      POSTGRES_PASSWORD: stockai
      POSTGRES_DB: stockai
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stockai -d stockai"]
      interval: 10s
      timeout: 5s
      retries: 5

  valkey:
    image: valkey/valkey:8-alpine
    container_name: stockai-valkey
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - valkey_data:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: stockai-api
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+asyncpg://stockai:stockai@postgres:5432/stockai
      VALKEY_URL: redis://valkey:6379/0
      REDIS_URL: redis://valkey:6379/0
      API_V1_PREFIX: /api/v1
      PROJECT_NAME: StockAI
      DEBUG: "false"
      BACKEND_CORS_ORIGINS: '["http://localhost:3000","http://localhost:3001"]'
      LOG_LEVEL: INFO
      LOG_FORMAT: json
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
    volumes:
      - ./model_artifacts:/app/model_artifacts:ro
      - ./backend/model_artifacts:/app/backend/model_artifacts:ro
    command: uvicorn apps.api.main:app --host 0.0.0.0 --port 8000 --workers 2
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  frontend:
    build:
      context: ./stockai
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
    container_name: stockai-frontend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy
    # No volume mounts for production; built standalone output is used

volumes:
  postgres_data:
  valkey_data:

networks:
  default:
    name: stockai-network
